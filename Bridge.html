<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Phoenix Command Connector</title></head>
<body>
<script>
(function () {
  'use strict';
  const parentOrigin = <?!= JSON.stringify(bridgeOrigin) ?>;
  const channel = <?!= JSON.stringify(bridgeChannel) ?>;
  const allow = new Set([
    'checkAdminLogin', 'getAdminName', 'getAllMissions', 'deployMission',
    'updateMissionStatus', 'getSpyData', 'addNewSpyAgent', 'updateSpyStatus',
    'getFullStatus', 'updateSystemStatus', 'getCurrentSituation',
    'updateCurrentSituation', 'getSituationMasterData'
  ]);
  if (!parentOrigin || !/^https:\/\/[^/]+$/.test(parentOrigin) || !channel) return;
  function respond(payload) {
    window.top.postMessage(Object.assign({ phoenixBridge: true, channel }, payload), parentOrigin);
  }
  window.addEventListener('message', function (event) {
    if (event.source !== window.top || event.origin !== parentOrigin) return;
    const msg = event.data;
    if (!msg || !msg.phoenixBridge || msg.channel !== channel || msg.kind !== 'call') return;
    if (!allow.has(msg.method)) return respond({ kind:'result', id:msg.id, ok:false, error:'Method not allowed' });
    try {
      const runner = google.script.run
        .withSuccessHandler(value => respond({ kind:'result', id:msg.id, ok:true, value }))
        .withFailureHandler(err => respond({ kind:'result', id:msg.id, ok:false, error:String(err && err.message || err) }));
      runner[msg.method].apply(runner, Array.isArray(msg.args) ? msg.args : []);
    } catch (error) {
      respond({kind:'result', id:msg.id, ok:false, error:String(error && error.message || error)});
    }
  });
  respond({ kind: 'ready' });
  // Reannounce readiness in case the parent is still attaching listeners/iframe.
  setTimeout(() => respond({ kind: 'ready' }), 750);
}());
</script></body></html>
